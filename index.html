<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه سه‌بعدی واقعی لوازم آرایشی و بهداشتی</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', system-ui, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; color: #fff; }
    #webgl-container { width: 100%; height: 100%; position: absolute; }

    /* UI Header & Controls */
    .top-bar { position: absolute; top: 15px; right: 15px; left: 15px; z-index: 10; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .brand-title { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); pointer-events: auto; }
    .brand-title h1 { font-size: 16px; color: #38bdf8; }

    /* Shopping Cart Widget */
    .cart-widget { position: absolute; bottom: 20px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.95); border: 2px solid #10b981; border-radius: 14px; padding: 12px 20px; font-size: 13px; color: #10b981; font-weight: bold; display: flex; gap: 15px; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    /* Product Details Modal */
    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; background: rgba(15, 23, 42, 0.98); border: 1px solid #38bdf8; border-radius: 16px; padding: 22px; width: 320px; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .modal h3 { color: #38bdf8; font-size: 16px; margin-bottom: 8px; }
    .modal .brand-tag { display: inline-block; background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-bottom: 10px; }
    .modal p { font-size: 12px; color: #cbd5e1; margin-bottom: 14px; line-height: 1.5; }
    .modal .price { font-size: 15px; color: #10b981; font-weight: bold; margin-bottom: 14px; }
    .btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .close-btn { position: absolute; top: 10px; left: 14px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="top-bar">
    <div class="brand-title">
      <h1>فروشگاه سه‌بعدی آرایشی و بهداشتی (تولید داخلی)</h1>
    </div>
  </div>

  <div class="cart-widget">
    <span>🛍️ سبد خرید: <span id="cart-count">۰</span> محصول</span>
    <span>|</span>
    <span>مجموع: <span id="cart-total">۰</span> تومان</span>
  </div>

  <div class="modal" id="product-modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <span class="brand-tag" id="m-brand">برند داخلی</span>
    <h3 id="m-title">نام محصول</h3>
    <p id="m-desc">توضیحات محصول...</p>
    <div class="price" id="m-price">قیمت: ۰ تومان</div>
    <button class="btn" style="background:#10b981;" onclick="addToCart()">🛒 افزودن به سبد خرید</button>
  </div>

  <script>
    // 1. Scene & Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('webgl-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.7);
    mainLight.position.set(10, 20, 15);
    mainLight.castShadow = true;
    scene.add(mainLight);

    // 3. Dynamic Textures
    function createBrandTexture(brandName, prodName, color1, color2) {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 512;
      const ctx = cv.getContext('2d');
      const grad = ctx.createLinearGradient(0,0,0,512);
      grad.addColorStop(0, color1); grad.addColorStop(1, color2);
      ctx.fillStyle = grad; ctx.fillRect(0,0,256,512);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(brandName, 128, 160);
      ctx.font = '20px sans-serif'; ctx.fillText(prodName, 128, 210);
      ctx.fillStyle = '#fef08a'; ctx.fillRect(30, 270, 196, 45);
      ctx.fillStyle = '#000000'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('ساخت ایران', 128, 300);
      return new THREE.CanvasTexture(cv);
    }

    const texShampooMY = createBrandTexture('MY', 'شامپو تقویتی', '#0284c7', '#0369a1');
    const texCinere = createBrandTexture('CINERE', 'کرم ضدچروک', '#059669', '#047857');
    const texFulica = createBrandTexture('FULICA', 'لوسیون بدن', '#d97706', '#b45309');

    // 4. Floor, Walls & Ceiling
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.1, metalness: 0.1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 40), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(30, 8, 0.5), wallMat);
    backWall.position.set(0, 4, -20);
    scene.add(backWall);

    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(30, 40), ceilingMat);
    ceiling.position.y = 8;
    ceiling.rotation.x = Math.PI / 2;
    scene.add(ceiling);

    for(let z = -15; z <= 15; z += 10) {
      const lightBox = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      lightBox.position.set(0, 7.9, z);
      scene.add(lightBox);
    }

    // 5. Layout: 3 Aisles & 12 Shelves
    const clickables = [];
    const aislePositionsX = [-8, 0, 8];

    aislePositionsX.forEach((ax) => {
      [-12, -4, 4, 12].forEach((sz) => {
        const shelfGroup = new THREE.Group();
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        
        const base = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 1.2), frameMat);
        base.position.y = 1.5;
        shelfGroup.add(base);

        // MY Shampoo
        const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.6, 24), new THREE.MeshStandardMaterial({ map: texShampooMY }));
        b1.position.set(-0.8, 3.3, 0);
        b1.userData = { brand: "برند مای (MY)", name: "شامپو تقویتی پروتئینه", price: "۱۲۰,۰۰۰", desc: "ترمیم کننده موهای آسیب دیده، حاوی ویتامین E." };
        shelfGroup.add(b1);
        clickables.push(b1);

        // Cinere Cream
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ map: texCinere }));
        b2.position.set(0, 3.2, 0);
        b2.userData = { brand: "سینره (Cinere)", name: "کرم احیاکننده شب", price: "۲۸۰,۰۰۰", desc: "فرمواسیون طبیعی برای جوان‌سازی پوست صورت." };
        shelfGroup.add(b2);
        clickables.push(b2);

        // Fulica Lotion
        const b3 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.75, 24), new THREE.MeshStandardMaterial({ map: texFulica }));
        b3.position.set(0.8, 3.4, 0);
        b3.userData = { brand: "فولیکا (Fulica)", name: "لوسیون بدن مرطوب‌کننده", price: "۱۹۵,۰۰۰", desc: "مناسب پوست‌های خشک و حساس با ماندگاری ۲۴ ساعته." };
        shelfGroup.add(b3);
        clickables.push(b3);

        shelfGroup.position.set(ax, 0, sz);
        scene.add(shelfGroup);
      });
    });

    // 6. Cart Logic
    let cartCount = 0;
    let cartTotal = 0;
    let activeProduct = null;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if(e.target.closest('.modal') || e.target.closest('.cart-widget') || e.target.closest('.top-bar')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(clickables);
      if (intersects.length > 0) {
        activeProduct = intersects[0].object.userData;
        document.getElementById('m-brand').innerText = activeProduct.brand;
        document.getElementById('m-title').innerText = activeProduct.name;
        document.getElementById('m-desc').innerText = activeProduct.desc;
        document.getElementById('m-price').innerText = `قیمت: ${activeProduct.price} تومان`;
        document.getElementById('product-modal').style.display = 'block';
      }
    });

    function addToCart() {
      if(activeProduct) {
        cartCount++;
        const numericPrice = parseInt(activeProduct.price.replace(/,/g, ''));
        cartTotal += numericPrice;
        document.getElementById('cart-count').innerText = cartCount;
        document.getElementById('cart-total').innerText = cartTotal.toLocaleString('fa-IR');
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('product-modal').style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
